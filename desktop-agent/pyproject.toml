[project]
name = "guidenco-client"
version = "0.1.0"
description = "Guidenco client — control your computer from the Guidenco dashboard."
requires-python = ">=3.10"
dependencies = [
  "mss>=9.0.1",        # screen capture
  "Pillow>=10.0.0",    # JPEG encode + downscale
  "pynput>=1.7.6",     # input injection
  "websockets>=12.0",  # cloud relay
  "requests>=2.31.0",  # pairing HTTP calls
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
guidenco-client = "guidenco_client.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guidenco_client*"]
