sonar.projectKey=artiste
sonar.projectName=Artiste - AI Digital Asset Creator
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=app,components,lib,scripts
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.ts,**/*.config.js,**/*.config.mjs

# Test directories
sonar.tests=__tests__,tests
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage reports
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Code duplication
sonar.cpd.exclusions=**/node_modules/**,**/.next/**,**/coverage/**

# ESLint integration
sonar.eslint.reportPaths=reports/eslint-report.json

# Security hotspots
sonar.security.hotspots.scanned=true

# Additional quality rules
sonar.qualitygate.timeout=300
