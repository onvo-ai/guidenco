version: "3.8"

# Environment: Use .env.docker file
# Run with: docker compose -f docker-compose.prod.yml --env-file .env.docker up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COOLIFY_URL: ${COOLIFY_URL}
        COOLIFY_FQDN: ${COOLIFY_FQDN}
        NODE_ENV: ${NODE_ENV}
        POSTGRES_URL: ${POSTGRES_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        SERVICE_URL_APP: ${SERVICE_URL_APP}
        SERVICE_FQDN_APP: ${SERVICE_FQDN_APP}
        COOLIFY_BUILD_SECRETS_HASH: ${COOLIFY_BUILD_SECRETS_HASH}
    container_name: guidenco-app-prod
    env_file:
      - ./.env
    environment:
      NODE_ENV: ${NODE_ENV}
      POSTGRES_URL: ${POSTGRES_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    ports:
      - 3000:3000
    restart: always
