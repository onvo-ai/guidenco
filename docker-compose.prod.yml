version: '3.8'

# Environment: Use .env.docker file
# Run with: docker compose -f docker-compose.prod.yml --env-file .env.docker up

services:
  artiste-app:
    image: artiste-app
    container_name: artiste-app
    build:
      context: ./
      dockerfile: ./Dockerfile
      target: production
    restart: always
    env_file:
      - ./.env
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
