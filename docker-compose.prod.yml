version: "3.8"

# ============================================================================
# PRODUCTION DOCKER COMPOSE - Secure Configuration
# ============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up --build
#
# Secrets are loaded from .env file at RUNTIME (not baked into image)
# Only NEXT_PUBLIC_* vars are passed as build args (they're public anyway)
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.secure
      args:
        # Only public env vars needed at build time (embedded in JS bundle)
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: guidenco-app-prod
    # ✅ Secrets loaded at runtime from env file (not in image layers)
    env_file:
      - ./.env
    ports:
      - 3000:3000
    restart: always
    # Security hardening (optional but recommended)
    # read_only: true
    # tmpfs:
    #   - /tmp:size=64m,noexec,nosuid
    #   - /app/.next/cache:size=128m,noexec,nosuid
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
