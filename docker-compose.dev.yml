version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artiste-app-dev
    environment:
      NODE_ENV: ${NODE_ENV}
      POSTGRES_URL: ${POSTGRES_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
