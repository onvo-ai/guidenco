version: "3.8"

# Environment: Use .env.docker file
# Run with: docker compose --env-file .env.docker up

services:
  postgres:
    image: postgres:18-alpine
    container_name: guidenco-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guidenco-network

  minio:
    image: minio/minio
    container_name: guidenco-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - guidenco-network

  stripe:
    image: stripe/stripe-cli:latest
    container_name: guidenco-stripe
    # Pass STRIPE_SECRET_KEY via --api-key flag so the CLI never prompts for login.
    # If STRIPE_SECRET_KEY is blank in .env.local the container exits cleanly with
    # a helpful message rather than blocking on the interactive pairing flow.
    entrypoint: >
      sh -c '
        if [ -z "$$STRIPE_SECRET_KEY" ]; then
          echo "INFO: STRIPE_SECRET_KEY is not set in .env.local — Stripe webhook forwarding is disabled.";
          echo "      Add your Stripe secret key to .env.local and restart to enable it.";
          exit 0;
        fi;
        exec stripe listen
          --api-key "$$STRIPE_SECRET_KEY"
          --forward-to http://host.docker.internal:3000/api/billing/webhook
      '
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - guidenco-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  guidenco-network:
    driver: bridge
