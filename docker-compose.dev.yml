version: "3.8"

# Environment: Use .env.docker file
# Run with: docker compose -f docker-compose.dev.yml --env-file .env.docker up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POSTGRES_URL: ${POSTGRES_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    container_name: guidenco-app-dev
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      POSTGRES_URL: ${POSTGRES_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks:
      - guidenco-network

  postgres:
    image: postgres:17-alpine
    container_name: guidenco-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guidenco-network

volumes:
  postgres_data:
    driver: local

networks:
  guidenco-network:
    driver: bridge
