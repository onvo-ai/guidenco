name: Database Migrations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Only run on push or merged PRs (not closed without merge)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: npm run db:push
        
      - name: Generate migration snapshot
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: npm run db:generate
        
      - name: Commit and push migration changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            git add drizzle/
            git commit -m "chore: update migration snapshots"
            git push
          else
            echo "No migration changes to commit"
          fi

  validate:
    runs-on: ubuntu-latest
    # Only run on push or merged PRs (not closed without merge)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate schema
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: npm run db:generate -- --studio
        continue-on-error: true
