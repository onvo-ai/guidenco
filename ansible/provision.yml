---
# provision.yml — Full Pi setup from a fresh Ubuntu install
#
# Prerequisites on your Mac:
#   brew install ansible
#
# Usage:
#   PI_HOST=192.168.0.42 PI_PASS=191996 ansible-playbook provision.yml
#
# What this does:
#   1. Installs system packages
#   2. Creates a Python venv with pip deps
#   3. Installs Node.js (via NodeSource) and frontend deps
#   4. Copies guidenco code
#   5. Builds the frontend
#   6. Sets up the USB HID gadget script
#   7. Installs and enables the systemd service

- name: Provision Guidenco on Raspberry Pi
  hosts: pi
  become: true
  vars:
    pi_user: ronnel
    project_dir: /home/ronnel/Desktop/guidenco
    venv_dir: /home/ronnel/Desktop/guidenco/venv
    # Change these if you use a different Pi model / OS
    nodejs_version: "18"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system packages
      apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - ffmpeg
          - v4l-utils
          - rsync
          - curl
          - git
        state: present

    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ pi_user }}"
        group: "{{ pi_user }}"
        mode: "0755"

    - name: Create Python venv
      become_user: "{{ pi_user }}"
      command: python3 -m venv {{ venv_dir }}
      args:
        creates: "{{ venv_dir }}/bin/python"

    - name: Copy project files (except venv, node_modules, ansible)
      become_user: "{{ pi_user }}"
      synchronize:
        src: "{{ playbook_dir }}/../../../"
        dest: "{{ project_dir }}/"
        rsync_opts:
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=.DS_Store"
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=frontend/node_modules"
          - "--exclude=frontend/src"
          - "--exclude=frontend/.vite"
          - "--exclude=.env"
          - "--exclude=ansible"
          - "--exclude=venv"

    - name: Install Python dependencies
      become_user: "{{ pi_user }}"
      pip:
        requirements: "{{ project_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: python3 -m venv

    - name: Install NodeSource repo for Node.js
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }}.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      apt:
        name: nodejs
        state: present

    - name: Install frontend Node dependencies
      become_user: "{{ pi_user }}"
      npm:
        path: "{{ project_dir }}/frontend"
        production: false

    - name: Build frontend
      become_user: "{{ pi_user }}"
      command: npm run build
      args:
        chdir: "{{ project_dir }}/frontend"
        creates: "{{ project_dir }}/frontend/dist/index.html"

    - name: Make HID gadget script executable
      file:
        path: "{{ project_dir }}/setup_hid_gadget.sh"
        mode: "0755"

    - name: Allow passwordless sudo for HID gadget script
      copy:
        dest: /etc/sudoers.d/guidenco-hid
        content: "{{ pi_user }} ALL=(ALL) NOPASSWD: {{ project_dir }}/setup_hid_gadget.sh\n"
        mode: "0440"
        validate: /usr/sbin/visudo -csf %s

    - name: Udev rule for /dev/hidg0 permissions
      copy:
        dest: /etc/udev/rules.d/99-hidg0.rules
        content: 'SUBSYSTEM=="usb", KERNEL=="hidg0", MODE="0666"'
        mode: "0644"
      notify: Reload udev

    - name: Install systemd service
      copy:
        src: "{{ project_dir }}/guidenco.service"
        dest: /etc/systemd/system/guidenco.service
        mode: "0644"
        remote_src: true
      notify: Reload systemd

    - name: Enable guidenco service
      systemd:
        name: guidenco
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Reload udev
      command: udevadm control --reload-rules